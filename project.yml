name: ProCameraStudio
options:
  bundleIdPrefix: com.vipanshijain
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
targets:
  ProCameraStudio:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ProCameraStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vipanshijain.ProCameraStudio
        INFOPLIST_FILE: ProCameraStudio/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  ProCameraStudioTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ProCameraStudioTests
    dependencies:
      - target: ProCameraStudio
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ProCameraStudio:
    build:
      targets:
        ProCameraStudio: all
        ProCameraStudioTests: [test]
    test:
      targets:
        - ProCameraStudioTests
    run:
      config: Debug
